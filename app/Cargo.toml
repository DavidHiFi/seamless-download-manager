[package]
name = "seamless-download-manager"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "seamless-download-manager"
path = "src/main.rs"

[dependencies]
sdm-core.workspace = true
sdm-api.workspace = true
sdm-engine.workspace = true
tokio.workspace = true
anyhow.workspace = true
serde_json.workspace = true
url.workspace = true
chrono.workspace = true
tracing.workspace = true
slint = { version = "1.19", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg", "renderer-software", "raw-window-handle-06"] }
raw-window-handle = "0.6"
tray-icon = "0.26"
arboard = { version = "3", default-features = false }
rfd = "0.15"
reqwest = { workspace = true, features = ["json"] }
windows = { workspace = true, features = ["Win32_System_Com", "Win32_UI_Shell_Common", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_Graphics_Gdi", "Win32_System_Console", "Win32_Media_Audio", "Win32_System_Power", "Win32_System_LibraryLoader"] }

[build-dependencies]
slint-build = "1.19"
embed-resource = "3"
